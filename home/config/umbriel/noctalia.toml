[colors]
background = "#2b1b1fFF"
text_primary = "#f7dce0FF"
text_muted = "#e1bec4FF"
accent_primary = "#ffb1c2FF"
accent_secondary = "#ffb1c2FF"
warning = "#ffb695FF"
error = "#ffb4abFF"
insert_hint = "#ffb69580"
backdrop = "#594045FF"

[colors.border]
focused = "#ffb1c2FF"
unfocused = "#594045FF"
outer = "#1d0f13FF"

[colors.overview]
background_tint = "#1d0f1388"
badge = "#ffb1c2FF"
workspace_background = "#1d0f13FF"

[colors.tab_bar]
background = "#2b1b1fFF"
text = "#e1bec4FF"
active = "#ffb1c2FF"
active_text = "#66002bFF"
active_unfocused = "#594045FF"
active_unfocused_text = "#f7dce0FF"
urgent = "#ffb4abFF"
urgent_text = "#690005FF"

[colors.title_bar]
background = "#2b1b1fFF"
background_unfocused = "#1d0f13FF"
text = "#f7dce0FF"
text_unfocused = "#e1bec4FF"
close = "#ffb4abFF"
maximize = "#ffb1c2FF"
minimize = "#ffb1c2FF"

[[window_rule]]
match.is_scratchpad = true
border_color_focused = "#ffb695FF"
border_color_unfocused = "#f36403FF"
